# WireHole - domains that can return a private IP address.
#
# Unbound removes private IP addresses from the answers of public domains.
# This protects you against DNS rebinding attacks.
# Some services need a private address in a public domain. Unbound must not
# remove the address of these domains.
#
# IMPORTANT: This stack mounts this directory over the directory of the
# image. The mount hides the file of the image with the same name.
# Therefore this file keeps the two domains of the image.
#
# Add your own domains below. Example: your router uses a public domain
# name for a local device.

server:
    # Plex uses this domain for direct connections to a local server.
    private-domain: "plex.direct"

    # nip.io returns the IP address that is part of the name.
    private-domain: "nip.io"

    # Add your domains here.
    # private-domain: "home.example.com"
