# WireHole - additional settings for Unbound.
#
# The Docker image already has a good basic configuration. That configuration
# follows the official Pi-hole guide. This file adds settings only.
# The settings in this file replace the settings of the image.
#
# Look at the configuration of the image with this command:
#   docker run --rm --entrypoint cat klutchell/unbound:1.26.0 /etc/unbound/unbound.conf
#
# The image already sets these options. Do not set them again:
#   interface, do-ip4, do-udp, do-tcp, harden-glue, harden-dnssec-stripped,
#   use-caps-for-id, edns-buffer-size, prefetch, prefetch-key, num-threads,
#   msg-cache-size, rrset-cache-size, serve-expired, access-control,
#   private-address, root-hints, auto-trust-anchor-file.
#
# The manual of all options is here:
#   https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html

server:
    ###########################################################################
    # USER
    ###########################################################################

    # Do not change the user of the process.
    # Docker already starts this container as the user "unbound" (101:102).
    # The file "docker-compose.yml" contains the setting "user".
    # Unbound cannot change the user without root rights. Unbound stops with
    # the error "unable to set group id" if this setting is not empty.
    username: ""

    ###########################################################################
    # IP VERSION
    ###########################################################################

    # Do not use IPv6 to ask the other name servers.
    # IMPORTANT: The Docker network of this stack uses IPv4 only. Unbound
    # cannot reach an IPv6 name server from this network. Unbound tries the
    # IPv6 addresses first, and then all queries fail with SERVFAIL.
    # Set the value "yes" only if your Docker network has real IPv6.
    do-ip6: no

    ###########################################################################
    # LOGGING
    ###########################################################################

    # Write only the errors to the log. Level 0 is the lowest level.
    # Increase the level to 1 or 2 to find a problem.
    verbosity: 0

    # Do not write one line for each query. This protects the privacy of
    # the users. It also keeps the log small.
    log-queries: no
    log-replies: no
    log-local-actions: no

    # Do not write a line for each SERVFAIL answer.
    # Set the value "yes" to find a problem with a domain.
    log-servfail: no

    ###########################################################################
    # PRIVACY
    ###########################################################################

    # Send the minimum information to the upstream servers.
    # The upstream servers cannot see the full domain name.
    qname-minimisation: yes

    # Use the DNSSEC records in the cache to answer for names that do not
    # exist. Unbound sends fewer queries to the internet. This is faster and
    # more private. See RFC 8198.
    aggressive-nsec: yes

    # Do not tell your server name or your Unbound version to a client.
    hide-identity: yes
    hide-version: yes

    # Wait before you close a UDP port after a timeout. Late answers cannot
    # arrive at a new port. The value is in milliseconds.
    delay-close: 10000

    ###########################################################################
    # SECURITY
    ###########################################################################

    # Stop an attacker who removes the strong algorithms from a DS record.
    harden-algo-downgrade: yes

    # Answer NXDOMAIN for a name below a name that does not exist. See RFC 8020.
    harden-below-nxdomain: yes

    # Do not accept glue records that the server is not responsible for.
    # This option is available in Unbound 1.22.0 and later.
    harden-unverified-glue: yes

    # Ignore a query that is too large.
    harden-large-queries: yes

    # Ignore an EDNS buffer size that is too small.
    harden-short-bufsize: yes

    # Remove the unsigned data from the additional section of a secure answer.
    val-clean-additional: yes

    # Count the unwanted answers. Unbound clears the cache after this number.
    # A cleared cache removes poisoned records.
    unwanted-reply-threshold: 10000000

    ###########################################################################
    # PERFORMANCE
    ###########################################################################

    # Keep an answer in the cache for a minimum of 60 seconds. A very short
    # TTL from a domain owner cannot cause many queries.
    # Set the value 0 to always obey the domain owner.
    cache-min-ttl: 60

    # Keep an answer in the cache for a maximum of 24 hours.
    cache-max-ttl: 86400

    # The size of the cache for the names that do not exist.
    neg-cache-size: 4M

    # Do not add the authority section and the additional section when a
    # client does not need them. The answers are smaller and faster.
    minimal-responses: yes

    # Change the order of the records in an answer. This gives a simple
    # load balance between the addresses of one name.
    rrset-roundrobin: yes

    # Send an Extended DNS Error code to the client. The client learns the
    # reason for a failure. See RFC 8914.
    ede: yes
    ede-serve-expired: yes

    ###########################################################################
    # OPTIONAL SETTINGS
    ###########################################################################
    # Remove the comment character to use a setting.

    # Send an empty answer to a query of type ANY. Attackers use these
    # queries for amplification attacks.
    # deny-any: yes

    # Limit the queries per second to one name server.
    # ratelimit: 1000

    # Increase the size of the kernel receive buffer. Unbound loses fewer
    # messages in a traffic peak.
    # IMPORTANT: This option needs a large value of "net.core.rmem_max" on
    # the host. Unbound writes the warning "so-rcvbuf was not granted" if the
    # value is too small. Run this command on the host first:
    #   sudo sysctl -w net.core.rmem_max=1048576
    # so-rcvbuf: 1m
